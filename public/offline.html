<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <title>Swaply — Offline</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #f8fafc; color: #18181b; }
      main { max-width: 28rem; padding: 2rem; text-align: center; }
      button { min-height: 44px; border: 0; border-radius: 999px; padding: .75rem 1.25rem; background: #2563eb; color: white; font-weight: 700; }
      @media (prefers-color-scheme: dark) { body { background: #09090b; color: #fafafa; } }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>Reconnect to continue your Swaply journey. Private exchange data is never stored in the offline page cache.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
