name: V1-09.3.2 authenticated constrained performance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "e2e/**"
      - "scripts/run-v1-09-3-2-authenticated-performance.mjs"
      - ".github/workflows/v1-09-3-2-authenticated-performance.yml"
      - "package.json"
      - "package-lock.json"
      - "next.config.*"

permissions:
  contents: read

concurrency:
  group: v1-09-3-2-authenticated-performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authenticated-constrained-performance:
    name: Authenticated mobile + Slow-4G baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: 127.0.0.1
      PORT: "3000"
      V10932_BASE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
      SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
      E2E_USER_A_EMAIL: ${{ secrets.E2E_USER_A_EMAIL }}
      E2E_USER_A_PASSWORD: ${{ secrets.E2E_USER_A_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required authenticated-test environment
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY"
          test -n "$E2E_USER_A_EMAIL"
          test -n "$E2E_USER_A_PASSWORD"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install repository dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build application
        run: npm run build

      - name: Prepare standalone runtime
        run: |
          cp -R public .next/standalone/public
          mkdir -p .next/standalone/.next
          cp -R .next/static .next/standalone/.next/static

      - name: Start application
        run: |
          node .next/standalone/server.js > /tmp/v1-09-3-2-next.log 2>&1 &
          echo $! > /tmp/v1-09-3-2-next.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/en >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/v1-09-3-2-next.log
          exit 1

      - name: Run authenticated constrained-device/network baseline
        run: node scripts/run-v1-09-3-2-authenticated-performance.mjs

      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1-09-3-2-authenticated-performance-evidence-${{ github.run_id }}
          path: audit-results/v1-09-3-2/
          if-no-files-found: error
          retention-days: 90

      - name: Upload application log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v1-09-3-2-runtime-log-${{ github.run_id }}
          path: /tmp/v1-09-3-2-next.log
          if-no-files-found: warn
          retention-days: 30
