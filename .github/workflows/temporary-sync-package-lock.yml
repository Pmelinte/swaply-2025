name: Temporary package-lock sync

on:
  push:
    branches:
      - fix/sync-package-lock-swc

permissions:
  contents: write

jobs:
  sync-lockfile:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/sync-package-lock-swc

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate package-lock.json
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify clean install
        run: npm ci --ignore-scripts

      - name: Commit synchronized lockfile and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/temporary-sync-package-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/temporary-sync-package-lock.yml
          if git diff --cached --quiet; then
            echo "No lockfile changes were needed."
            exit 0
          fi
          git commit -m "chore: synchronize package lockfile"
          git push origin HEAD:fix/sync-package-lock-swc
