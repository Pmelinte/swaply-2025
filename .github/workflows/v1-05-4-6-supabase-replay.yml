name: V1-05.4.6 Supabase Replay

on:
  pull_request:
    paths:
      - ".github/workflows/v1-05-4-6-supabase-replay.yml"
      - "supabase/migrations/20260802170000_v1_05_4_3_property_reservation_authority.sql"
      - "supabase/migrations/20260802190000_v1_05_4_4_service_delivery_authority.sql"
      - "supabase/migrations/20260803001000_v1_05_4_5_event_transfer_authority.sql"
      - "supabase/migrations/20260803030000_v1_05_4_5_event_transfer_hardening.sql"
      - "supabase/migrations/20260803030500_v1_05_4_5_event_completion_guard_contract.sql"
      - "supabase/migrations/20260803043000_v1_05_4_6_domain_aware_exchange_completion.sql"
      - "supabase/tests/fixtures/v1_05_4_4_current_contract_fixture.sql"
      - "supabase/tests/fixtures/v1_05_4_5_event_contract_fixture.sql"
      - "supabase/tests/fixtures/v1_05_4_6_completion_contract_fixture.sql"
      - "supabase/tests/v1_05_4_6_domain_aware_exchange_completion_contract.sql"
      - "supabase/tests/v1_05_4_6_domain_aware_exchange_completion_replay.sql"
      - "supabase/migration-governance/forward-epoch.json"
      - "src/__tests__/v1-05-4-6-domain-aware-exchange-completion.test.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v1-05-4-6-supabase-replay-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  authenticated-domain-completion-replay:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Prepare isolated current-contract project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .ci-supabase
          mkdir -p .ci-supabase
          cd .ci-supabase
          supabase init
          rm -rf supabase/migrations supabase/tests
          mkdir -p supabase/migrations supabase/tests evidence

          cp \
            ../supabase/tests/fixtures/v1_05_4_4_current_contract_fixture.sql \
            supabase/migrations/00000000000000_v1_05_4_4_current_contract_fixture.sql
          cp \
            ../supabase/tests/fixtures/v1_05_4_6_completion_contract_fixture.sql \
            supabase/migrations/00000000000001_v1_05_4_6_completion_contract_fixture.sql
          cp \
            ../supabase/tests/fixtures/v1_05_4_5_event_contract_fixture.sql \
            supabase/migrations/00000000000002_v1_05_4_5_event_contract_fixture.sql
          cp \
            ../supabase/migrations/20260802170000_v1_05_4_3_property_reservation_authority.sql \
            supabase/migrations/
          cp \
            ../supabase/migrations/20260802190000_v1_05_4_4_service_delivery_authority.sql \
            supabase/migrations/
          cp \
            ../supabase/migrations/20260803001000_v1_05_4_5_event_transfer_authority.sql \
            supabase/migrations/
          cp \
            ../supabase/migrations/20260803030000_v1_05_4_5_event_transfer_hardening.sql \
            supabase/migrations/
          cp \
            ../supabase/migrations/20260803030500_v1_05_4_5_event_completion_guard_contract.sql \
            supabase/migrations/
          cp \
            ../supabase/migrations/20260803043000_v1_05_4_6_domain_aware_exchange_completion.sql \
            supabase/migrations/
          cp \
            ../supabase/tests/v1_05_4_6_domain_aware_exchange_completion_contract.sql \
            supabase/tests/
          cp \
            ../supabase/tests/v1_05_4_6_domain_aware_exchange_completion_replay.sql \
            supabase/tests/

          sha256sum \
            supabase/migrations/00000000000000_v1_05_4_4_current_contract_fixture.sql \
            supabase/migrations/00000000000001_v1_05_4_6_completion_contract_fixture.sql \
            supabase/migrations/00000000000002_v1_05_4_5_event_contract_fixture.sql \
            supabase/migrations/20260802170000_v1_05_4_3_property_reservation_authority.sql \
            supabase/migrations/20260802190000_v1_05_4_4_service_delivery_authority.sql \
            supabase/migrations/20260803001000_v1_05_4_5_event_transfer_authority.sql \
            supabase/migrations/20260803030000_v1_05_4_5_event_transfer_hardening.sql \
            supabase/migrations/20260803030500_v1_05_4_5_event_completion_guard_contract.sql \
            supabase/migrations/20260803043000_v1_05_4_6_domain_aware_exchange_completion.sql \
            supabase/tests/v1_05_4_6_domain_aware_exchange_completion_contract.sql \
            supabase/tests/v1_05_4_6_domain_aware_exchange_completion_replay.sql \
            | tee evidence/input-sha256.txt

      - name: Start isolated Supabase stack
        working-directory: .ci-supabase
        shell: bash
        run: |
          set -o pipefail
          supabase start \
            -x studio,imgproxy,storage-api,realtime,inbucket,edge-runtime,logflare,vector,supavisor \
            2>&1 | tee evidence/supabase-start.log

      - name: Record isolated stack identity
        working-directory: .ci-supabase
        shell: bash
        run: |
          set -euo pipefail
          supabase status | tee evidence/supabase-status.txt
          supabase migration list --local | tee evidence/migration-list.txt

      - name: Run V1-05.4.6 catalog contract
        working-directory: .ci-supabase
        shell: bash
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql \
            --host 127.0.0.1 \
            --port 54322 \
            --username postgres \
            --dbname postgres \
            --set ON_ERROR_STOP=1 \
            --file supabase/tests/v1_05_4_6_domain_aware_exchange_completion_contract.sql \
            2>&1 | tee evidence/catalog-contract.log

      - name: Run authenticated rollback-only domain completion replay
        working-directory: .ci-supabase
        shell: bash
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql \
            --host 127.0.0.1 \
            --port 54322 \
            --username postgres \
            --dbname postgres \
            --set ON_ERROR_STOP=1 \
            --file supabase/tests/v1_05_4_6_domain_aware_exchange_completion_replay.sql \
            2>&1 | tee evidence/authenticated-replay.log

      - name: Verify rollback cleanup
        working-directory: .ci-supabase
        shell: bash
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql \
            --host 127.0.0.1 \
            --port 54322 \
            --username postgres \
            --dbname postgres \
            --set ON_ERROR_STOP=1 \
            2>&1 <<'SQL' | tee evidence/cleanup.log
          do $cleanup$
          begin
            if exists (
              select 1 from auth.users where id::text like 'a5460000-%'
            ) or exists (
              select 1 from public.profiles where user_id::text like 'a5460000-%'
            ) or exists (
              select 1 from public.items where id::text like 'a5460000-%'
            ) or exists (
              select 1 from public.conversations where id::text like 'a5460000-%'
            ) or exists (
              select 1 from public.swaps where id::text like 'a5460000-%'
            ) or exists (
              select 1 from public.property_reservations where id::text like 'a5460000-%'
            ) or exists (
              select 1 from public.service_deliveries where id::text like 'a5460000-%'
            ) or exists (
              select 1 from public.event_transfers where id::text like 'a5460000-%'
            ) or exists (
              select 1 from public.swap_completion_confirmations
              where swap_id::text like 'a5460000-%'
            ) or exists (
              select 1 from public.swap_completion_effects
              where swap_id::text like 'a5460000-%'
            ) or exists (
              select 1 from public.swap_post_completion_effects
              where swap_id::text like 'a5460000-%'
            ) then
              raise exception 'V1-05.4.6 rollback cleanup left deterministic fixture data.';
            end if;
          end;
          $cleanup$;

          select jsonb_build_object(
            'v1_05_4_6_cleanup', 'PASS',
            'fixture_users', 0,
            'fixture_items', 0,
            'fixture_conversations', 0,
            'fixture_exchanges', 0,
            'fixture_domain_ledgers', 0,
            'fixture_completion_rows', 0
          ) as cleanup_result;
          SQL

      - name: Upload replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1-05-4-6-supabase-replay-${{ github.run_id }}
          path: .ci-supabase/evidence
          if-no-files-found: warn
          retention-days: 30

      - name: Stop isolated Supabase stack
        if: always()
        working-directory: .ci-supabase
        run: supabase stop --no-backup
