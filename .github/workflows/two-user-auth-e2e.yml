name: Train C Authenticated E2E

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  NEXT_TELEMETRY_DISABLED: "1"
  PLAYWRIGHT_BASE_URL: https://www.swaply.world
  E2E_USER_A_EMAIL: ${{ secrets.E2E_USER_A_EMAIL }}
  E2E_USER_A_PASSWORD: ${{ secrets.E2E_USER_A_PASSWORD }}
  E2E_USER_B_EMAIL: ${{ secrets.E2E_USER_B_EMAIL }}
  E2E_USER_B_PASSWORD: ${{ secrets.E2E_USER_B_PASSWORD }}

jobs:
  authenticated-e2e:
    name: Authenticated Baseline and Profile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required secrets
        shell: bash
        run: |
          test -n "$E2E_USER_A_EMAIL"
          test -n "$E2E_USER_A_PASSWORD"
          test -n "$E2E_USER_B_EMAIL"
          test -n "$E2E_USER_B_PASSWORD"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run authenticated baseline and profile validation
        run: npx playwright test --config=playwright.two-user.config.ts --project=two-user-auth --project=profile

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: train-c-authenticated-report
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: train-c-authenticated-results
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
