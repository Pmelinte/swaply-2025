name: Train C Authenticated E2E
run-name: Train C Authenticated E2E — ${{ inputs.base_url || 'automatic Preview' }}

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Optional override. Leave empty to use the canonical Preview alias for PR #531."
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  NEXT_TELEMETRY_DISABLED: "1"
  DEFAULT_PREVIEW_URL: "https://swaply-2025-git-codex-finalize-63b1b5-petrus-projects-d4a0946c.vercel.app"
  VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
  E2E_USER_A_EMAIL: ${{ secrets.E2E_USER_A_EMAIL }}
  E2E_USER_A_PASSWORD: ${{ secrets.E2E_USER_A_PASSWORD }}
  E2E_USER_B_EMAIL: ${{ secrets.E2E_USER_B_EMAIL }}
  E2E_USER_B_PASSWORD: ${{ secrets.E2E_USER_B_PASSWORD }}

jobs:
  authenticated-e2e:
    name: Authenticated Train C through C3 closure
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Preview target
        id: target
        shell: bash
        env:
          INPUT_BASE_URL: ${{ inputs.base_url }}
        run: |
          set -euo pipefail

          target="${INPUT_BASE_URL:-}"
          if [ -z "$target" ]; then
            target="$DEFAULT_PREVIEW_URL"
          fi
          target="${target%/}"

          case "$target" in
            https://www.swaply.world|https://swaply.world)
              echo "::error::Production is forbidden for PR validation. Use the Preview deployment."
              exit 1
              ;;
          esac

          echo "base_url=$target" >> "$GITHUB_OUTPUT"
          echo "PLAYWRIGHT_BASE_URL=$target" >> "$GITHUB_ENV"
          echo "Resolved target: $target"

      - name: Verify required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$E2E_USER_A_EMAIL"
          test -n "$E2E_USER_A_PASSWORD"
          test -n "$E2E_USER_B_EMAIL"
          test -n "$E2E_USER_B_PASSWORD"

      - name: Wait for exact Preview deployment
        shell: bash
        run: |
          set -euo pipefail

          curl_args=(
            --silent
            --show-error
            --location
            --max-time 45
          )

          if [ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]; then
            curl_args+=(
              --header "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}"
              --header "x-vercel-set-bypass-cookie: true"
            )
          fi

          expected_sha="$GITHUB_SHA"
          build_info_url="${PLAYWRIGHT_BASE_URL}/api/build-info"

          for attempt in $(seq 1 30); do
            response="$(curl "${curl_args[@]}" "$build_info_url" 2>/dev/null || true)"
            deployed_sha="$(printf '%s' "$response" | node -e '
              let input = "";
              process.stdin.on("data", chunk => input += chunk);
              process.stdin.on("end", () => {
                try {
                  const value = JSON.parse(input);
                  process.stdout.write(typeof value.commitSha === "string" ? value.commitSha : "");
                } catch {
                  process.stdout.write("");
                }
              });
            ')"

            echo "Deployment check $attempt/30: expected=$expected_sha deployed=${deployed_sha:-unavailable}"

            if [ "$deployed_sha" = "$expected_sha" ]; then
              echo "Exact Preview deployment is ready."
              exit 0
            fi

            sleep 10
          done

          echo "::error::Preview alias did not reach commit $expected_sha. Refusing to run tests against stale code."
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run deterministic authenticated Train C through Batch 62.3
        run: npx playwright test --config=playwright.two-user.config.ts --project=c3-closure-authenticated

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: train-c-authenticated-report
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: train-c-authenticated-results
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
