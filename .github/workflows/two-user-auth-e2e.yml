name: Train C Authenticated E2E
run-name: Train C Authenticated E2E — ${{ github.event_name == 'workflow_dispatch' && inputs.base_url || 'PR Preview' }}

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Full target URL. Use the Vercel Preview branch alias for PR validation."
        required: true
        default: "https://www.swaply.world"
        type: string
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/two-user-auth-e2e.yml"
      - "playwright.two-user.config.ts"
      - "e2e/c3-closure-authenticated.spec.ts"
      - "supabase/migrations/20260715161000_batch_62_3_authenticated_e2e_cleanup.sql"

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  NEXT_TELEMETRY_DISABLED: "1"
  PLAYWRIGHT_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.base_url || 'https://swaply-2025-git-agent-batch-62-6507dd-petrus-projects-d4a0946c.vercel.app' }}
  VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
  E2E_USER_A_EMAIL: ${{ secrets.E2E_USER_A_EMAIL }}
  E2E_USER_A_PASSWORD: ${{ secrets.E2E_USER_A_PASSWORD }}
  E2E_USER_B_EMAIL: ${{ secrets.E2E_USER_B_EMAIL }}
  E2E_USER_B_PASSWORD: ${{ secrets.E2E_USER_B_PASSWORD }}

jobs:
  authenticated-e2e:
    name: Authenticated Train C through C3 closure
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required secrets
        shell: bash
        run: |
          test -n "$E2E_USER_A_EMAIL"
          test -n "$E2E_USER_A_PASSWORD"
          test -n "$E2E_USER_B_EMAIL"
          test -n "$E2E_USER_B_PASSWORD"

      - name: Wait for target URL
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PLAYWRIGHT_BASE_URL"

          curl_args=(
            --silent
            --show-error
            --location
            --output /dev/null
            --write-out "%{http_code}"
            --max-time 45
          )

          if [ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]; then
            curl_args+=(
              --header "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}"
              --header "x-vercel-set-bypass-cookie: true"
            )
          fi

          for attempt in $(seq 1 30); do
            status="$(curl "${curl_args[@]}" "$PLAYWRIGHT_BASE_URL" || true)"
            echo "Attempt $attempt — target: $PLAYWRIGHT_BASE_URL — HTTP: ${status:-unreachable}"

            case "$status" in
              2*|3*) exit 0 ;;
            esac

            sleep 20
          done

          echo "::error::Target URL did not become reachable. If Preview is protected, configure VERCEL_AUTOMATION_BYPASS_SECRET."
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run deterministic authenticated Train C through Batch 62.3
        run: npx playwright test --config=playwright.two-user.config.ts --project=c3-closure-authenticated

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: train-c-authenticated-report
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: train-c-authenticated-results
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
