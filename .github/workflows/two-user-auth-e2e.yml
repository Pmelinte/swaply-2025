name: Train C Authenticated E2E
run-name: Train C Authenticated E2E — ${{ inputs.base_url }}

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Full target URL. Use the Vercel Preview branch alias for PR validation."
        required: true
        default: "https://www.swaply.world"
        type: string

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  NEXT_TELEMETRY_DISABLED: "1"
  PLAYWRIGHT_BASE_URL: ${{ inputs.base_url }}
  VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
  E2E_USER_A_EMAIL: ${{ secrets.E2E_USER_A_EMAIL }}
  E2E_USER_A_PASSWORD: ${{ secrets.E2E_USER_A_PASSWORD }}
  E2E_USER_B_EMAIL: ${{ secrets.E2E_USER_B_EMAIL }}
  E2E_USER_B_PASSWORD: ${{ secrets.E2E_USER_B_PASSWORD }}

jobs:
  authenticated-e2e:
    name: Authenticated Baseline, Profile and Objects CRUD
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required secrets
        shell: bash
        run: |
          test -n "$E2E_USER_A_EMAIL"
          test -n "$E2E_USER_A_PASSWORD"
          test -n "$E2E_USER_B_EMAIL"
          test -n "$E2E_USER_B_PASSWORD"

      - name: Verify target URL
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PLAYWRIGHT_BASE_URL"

          curl_args=(
            --silent
            --show-error
            --location
            --output /dev/null
            --write-out "%{http_code}"
            --max-time 45
          )

          if [ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]; then
            curl_args+=(
              --header "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}"
              --header "x-vercel-set-bypass-cookie: true"
            )
          fi

          status="$(curl "${curl_args[@]}" "$PLAYWRIGHT_BASE_URL")"
          echo "Target: $PLAYWRIGHT_BASE_URL"
          echo "HTTP status: $status"

          case "$status" in
            2*|3*) ;;
            *)
              echo "::error::Target URL is not reachable. If the Vercel Preview is protected, configure the repository secret VERCEL_AUTOMATION_BYPASS_SECRET."
              exit 1
              ;;
          esac

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run deterministic authenticated Train C dependency graph
        run: npx playwright test --config=playwright.two-user.config.ts --project=objects-crud

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: train-c-authenticated-report
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: train-c-authenticated-results
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
