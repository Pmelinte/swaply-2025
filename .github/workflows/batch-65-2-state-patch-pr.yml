name: Batch 65.2 PR State Integration

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/batch-65-2-state-patch-pr.yml"
      - "scripts/apply-batch-65-2-state-bridge.py"
      - "src/lib/profile/profileCompatibilityBridge.ts"
      - "src/lib/state/index.tsx"

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply deterministic bridge integration
        run: python scripts/apply-batch-65-2-state-bridge.py

      - name: Commit integration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No integration update required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/state/index.tsx
          git commit -m "Batch 65.2: integrate profile compatibility bridge"
          git push origin HEAD:${{ github.head_ref }}
