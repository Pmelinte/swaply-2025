name: Playwright Audit

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium

      - name: Read seed user email
        id: seed
        run: |
          if [ ! -f scripts/seed-users.json ]; then
            echo "::error::scripts/seed-users.json not found. Run seed-part2.mjs first and commit the file."
            exit 1
          fi
          EMAIL=$(node -e "const u=require('./scripts/seed-users.json'); console.log(u[0].email);")
          if [ -z "$EMAIL" ]; then
            echo "::error::Could not extract email from scripts/seed-users.json"
            exit 1
          fi
          echo "email=$EMAIL" >> "$GITHUB_OUTPUT"
          echo "Seed user email resolved."

      - name: Prepare output directories
        run: mkdir -p audit-reports screenshots

      - name: Write Playwright audit script
        run: |
          cat > audit.mjs << 'PLAYWRIGHT_SCRIPT'
          import { chromium } from '@playwright/test';
          import { writeFileSync, mkdirSync } from 'fs';
          import { resolve, dirname } from 'path';
          import { fileURLToPath } from 'url';

          const BASE_URL = 'https://www.swaply.world';
          const EMAIL    = process.env.SEED_USER_EMAIL;
          const PASSWORD = process.env.SEED_USER_PASSWORD;
          const REPORT_DATE = '2026-04-19';

          const ROUTES = [
            '/en/',
            '/en/objects',
            '/en/explore',
            '/en/matching',
            '/en/messages',
            '/en/chat',
            '/en/exchange',
            '/en/properties',
            '/en/services',
            '/en/events',
            '/en/blog',
            '/en/about',
            '/en/contact',
            '/en/profile',
            '/en/settings',
          ];

          function slug(route) {
            return route.replace(/^\//, '').replace(/\//g, '__') || 'home';
          }

          async function main() {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              viewport: { width: 1280, height: 800 },
              locale: 'en-US',
            });
            const page = await context.newPage();

            // --- Login ---
            console.log('Logging in as', EMAIL);
            const consoleErrors = {};
            const loginErrors = [];

            page.on('console', (msg) => {
              if (msg.type() === 'error') loginErrors.push(msg.text());
            });

            await page.goto(`${BASE_URL}/en/login`, { waitUntil: 'networkidle', timeout: 30000 });
            await page.fill('input[type="email"]', EMAIL);
            await page.fill('input[type="password"]', PASSWORD);
            await page.check('input[type="checkbox"]');
            await page.click('button[type="submit"]');
            // Wait for redirect away from /login after successful auth
            await page.waitForURL((url) => !url.pathname.includes('/login'), { timeout: 20000 }).catch(() => {});
            console.log('Post-login URL:', page.url());

            const results = [];

            // --- Visit each route ---
            for (const route of ROUTES) {
              const url = `${BASE_URL}${route}`;
              const routeErrors = [];
              const handler = (msg) => { if (msg.type() === 'error') routeErrors.push(msg.text()); };
              page.on('console', handler);

              let status = 'ok';
              let title = '';
              let screenshotFile = `screenshots/${slug(route)}.png`;

              try {
                const response = await page.goto(url, { waitUntil: 'networkidle', timeout: 30000 });
                await page.waitForTimeout(1500);
                title = await page.title();
                await page.screenshot({ path: screenshotFile, fullPage: true });
                if (response && response.status() >= 400) status = `http-${response.status()}`;
              } catch (err) {
                status = 'error';
                routeErrors.push(err.message);
              }

              page.off('console', handler);
              console.log(`[${status}] ${route} — "${title}" — ${routeErrors.length} console error(s)`);
              results.push({ route, url, status, title, screenshotFile, errors: routeErrors });
            }

            await browser.close();

            // --- Build Markdown report ---
            const ok    = results.filter((r) => r.status === 'ok' && r.errors.length === 0).length;
            const warns = results.filter((r) => r.status === 'ok' && r.errors.length > 0).length;
            const fails = results.filter((r) => r.status !== 'ok').length;

            const lines = [
              `# Playwright Audit — ${REPORT_DATE}`,
              '',
              `**Base URL:** ${BASE_URL}  `,
              `**Seed user:** ${EMAIL}  `,
              `**Routes tested:** ${results.length}  `,
              `**Passed (no console errors):** ${ok}  `,
              `**Warnings (console errors):** ${warns}  `,
              `**Failed:** ${fails}  `,
              '',
              '## Results',
              '',
              '| Route | Status | Title | Console errors |',
              '|-------|--------|-------|----------------|',
              ...results.map((r) =>
                `| \`${r.route}\` | ${r.status} | ${r.title || '—'} | ${r.errors.length} |`
              ),
              '',
              '## Per-page Details',
              '',
              ...results.flatMap((r) => [
                `### \`${r.route}\``,
                '',
                `- **URL:** ${r.url}`,
                `- **Status:** ${r.status}`,
                `- **Title:** ${r.title || '—'}`,
                `- **Screenshot:** ![${r.route}](../${r.screenshotFile})`,
                '',
                r.errors.length > 0
                  ? ['**Console errors:**', '```', ...r.errors, '```', ''].join('\n')
                  : '_No console errors._',
                '',
              ]),
            ];

            const reportPath = `audit-reports/playwright-${REPORT_DATE}.md`;
            writeFileSync(reportPath, lines.join('\n'));
            console.log(`Report written to ${reportPath}`);
          }

          main().catch((err) => { console.error(err); process.exit(1); });
          PLAYWRIGHT_SCRIPT

      - name: Run Playwright audit
        env:
          SEED_USER_EMAIL: ${{ steps.seed.outputs.email }}
          SEED_USER_PASSWORD: 'Swaply2026!'
        run: node audit.mjs

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots-${{ github.run_id }}
          path: screenshots/
          if-no-files-found: warn

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-audit-report-${{ github.run_id }}
          path: audit-reports/
          if-no-files-found: warn
