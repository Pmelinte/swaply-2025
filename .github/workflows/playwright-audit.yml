name: Playwright Audit

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      PLAYWRIGHT_BASE_URL: https://www.swaply.world
      PLAYWRIGHT_TEST_EMAIL: ${{ secrets.SEED_USER_EMAIL }}
      PLAYWRIGHT_TEST_PASSWORD: ${{ secrets.SEED_USER_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Ensure Playwright is installed
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium

      - name: Prepare output directories
        run: |
          rm -rf test-results
          rm -rf playwright-report
          rm -rf audit-reports
          rm -rf screenshots

          mkdir -p test-results
          mkdir -p playwright-report
          mkdir -p audit-reports
          mkdir -p screenshots

      - name: Debug repository files
        run: |
          echo "Repository root:"
          ls -la
          echo ""
          echo "Tests folder:"
          ls -la tests || true
          echo ""
          echo "Find all spec files:"
          find . -type f \( -name "*.spec.ts" -o -name "*.spec.js" -o -name "*.test.ts" -o -name "*.test.js" \) | sort

      - name: Run comprehensive Playwright audit
        run: npx playwright test --project=chromium
        continue-on-error: true

      - name: Collect audit artifacts
        if: always()
        run: |
          mkdir -p audit-reports/from-test-results
          mkdir -p screenshots/from-test-results

          find test-results -type f \( -name "*.json" -o -name "*.md" \) -exec cp {} audit-reports/from-test-results/ \; || true
          find test-results -type f \( -name "*.png" -o -name "*.jpg" -o -name "*.jpeg" -o -name "*.webp" \) -exec cp {} screenshots/from-test-results/ \; || true

      - name: Upload Playwright raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ github.run_id }}
          path: test-results/
          if-no-files-found: warn

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report-${{ github.run_id }}
          path: playwright-report/
          if-no-files-found: warn

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-audit-report-${{ github.run_id }}
          path: audit-reports/
          if-no-files-found: warn

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots-${{ github.run_id }}
          path: screenshots/
          if-no-files-found: warn
