name: Playwright Deep Audit

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      BASE_URL: https://www.swaply.world
      PLAYWRIGHT_BASE_URL: https://www.swaply.world
      PLAYWRIGHT_TEST_EMAIL: ${{ secrets.PLAYWRIGHT_TEST_EMAIL }}
      PLAYWRIGHT_TEST_PASSWORD: ${{ secrets.PLAYWRIGHT_TEST_PASSWORD }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          # Only npm packages are cached — auth state is never cached.
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Ensure Playwright browsers are installed
        run: npx playwright install --with-deps chromium

      - name: Prepare output directories
        run: |
          rm -rf test-results playwright-report audit-results
          mkdir -p test-results playwright-report audit-results

      - name: Run Playwright authenticated audit suite
        run: npx playwright test tests/audit.spec.ts --config=playwright.audit.config.ts

      - name: Upload deep audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-deep-audit-results-${{ github.run_id }}
          path: |
            audit-results/
            playwright-report/
            test-results/
          if-no-files-found: warn
