name: Playwright after deploy

on:
  push:
    branches:
      - main
  deployment_status:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to test"
        required: false
        default: "https://www.swaply.world"

jobs:
  test:
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install isolated Playwright
        run: |
          set -euo pipefail
          PW_DIR="$RUNNER_TEMP/swaply-playwright"
          mkdir -p "$PW_DIR"
          cd "$PW_DIR"
          npm init -y
          npm install playwright@1.58.2
          ./node_modules/.bin/playwright install chromium --with-deps

      - name: Run production smoke
        env:
          BASE_URL: ${{ github.event.inputs.base_url || 'https://www.swaply.world' }}
        run: |
          set -euo pipefail
          PW_DIR="$RUNNER_TEMP/swaply-playwright"
          cat > "$PW_DIR/smoke.mjs" <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs/promises';

          const baseUrl = process.env.BASE_URL || 'https://www.swaply.world';
          const routes = [
            '/en',
            '/en/objects',
            '/en/explore',
            '/en/matching',
            '/en/messages',
            '/en/exchange',
            '/en/chat',
            '/en/properties',
            '/en/services',
            '/en/events',
            '/en/about',
            '/en/contact',
          ];

          await fs.mkdir('test-results', { recursive: true });

          const browser = await chromium.launch();
          const page = await browser.newPage({ viewport: { width: 1280, height: 900 } });
          const failures = [];

          for (const route of routes) {
            const url = new URL(route, baseUrl).toString();
            const name = route.replace(/^\/en\/?/, '') || 'home';
            const safeName = name.replaceAll('/', '-') || 'home';

            try {
              const response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 45000 });
              await page.waitForTimeout(1000);
              await page.screenshot({ path: `test-results/${safeName}.png`, fullPage: true });

              const status = response?.status() ?? 0;
              console.log(`${route} -> HTTP ${status} -> ${page.url()}`);

              if (status === 0 || status >= 500) {
                failures.push(`${route} returned HTTP ${status}`);
              }
            } catch (error) {
              failures.push(`${route}: ${error instanceof Error ? error.message : String(error)}`);
            }
          }

          await browser.close();

          if (failures.length > 0) {
            console.error('Smoke failures:');
            for (const failure of failures) console.error(`- ${failure}`);
            process.exit(1);
          }

          console.log('Smoke passed.');
          NODE
          node "$PW_DIR/smoke.mjs"

      - name: Upload screenshots artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
