name: Playwright after deploy

on:
  push:
    branches:
      - main
  deployment_status:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to test"
        required: false
        default: "https://www.swaply.world"

jobs:
  test:
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install chromium --with-deps

      - name: Run tests
        id: tests
        continue-on-error: true
        env:
          BASE_URL: "https://www.swaply.world"
        run: npx playwright test --config playwright.audit.config.ts tests/smoke.spec.ts

      - name: Upload screenshots to Cloudinary
        if: always()
        env:
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
        run: |
          if [ -z "${CLOUDINARY_URL:-}" ]; then
            echo "CLOUDINARY_URL not set — skipping inline previews"
            echo "{}" > cloudinary-urls.json
            exit 0
          fi
          python -m pip install --quiet cloudinary
          python - <<'PY'
          import cloudinary, cloudinary.uploader, glob, json, os
          urls = {}
          for path in sorted(glob.glob("test-results/*.png")):
              name = os.path.basename(path)
              res = cloudinary.uploader.upload(
                  path,
                  folder=f"swaply-smoke/{os.environ['GITHUB_RUN_ID']}",
                  public_id=name.removesuffix(".png"),
                  overwrite=True,
                  resource_type="image",
              )
              urls[name] = res["secure_url"]
          with open("cloudinary-urls.json", "w") as f:
              json.dump(urls, f)
          print(json.dumps(urls, indent=2))
          PY

      - name: Post commit comment with previews
        if: always()
        uses: actions/github-script@v7
        env:
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          DEPLOY_URL: "https://www.swaply.world"
        with:
          script: |
            const fs = require('fs');
            let urls = {};
            try {
              urls = JSON.parse(fs.readFileSync('cloudinary-urls.json', 'utf8'));
            } catch {}

            const sha = context.payload.deployment?.sha || context.sha;
            const status = process.env.TESTS_OUTCOME === 'success' ? '✅' : '❌';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const lines = [
              `## ${status} Playwright smoke — \`${process.env.DEPLOY_URL}\``,
              ``,
              `**Run:** [#${context.runId}](${runUrl})  `,
              `**Artifact:** \`screenshots-${context.runId}\` (download from the run page)`,
              ``,
            ];

            const entries = Object.entries(urls);
            if (entries.length === 0) {
              lines.push('_No inline previews — set `CLOUDINARY_URL` repo secret to enable._');
            } else {
              for (const [name, url] of entries) {
                lines.push(`### ${name.replace('.png','')}`);
                lines.push(`![${name}](${url})`);
                lines.push('');
              }
            }

            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: sha,
              body: lines.join('\n'),
            });

      - name: Upload screenshots artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_id }}
          path: test-results/

      - name: Fail workflow if tests failed
        if: steps.tests.outcome != 'success'
        run: |
          echo "Smoke tests failed — see commit comment + run logs."
          exit 1
