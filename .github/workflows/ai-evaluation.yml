name: AI Evaluation & Regression Gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-eval-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  ai-evaluation:
    name: AI Evaluation & Regression Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run zero-cost AI regression suite
        run: npm run eval:ai

      - name: Upload AI evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-evaluation-results
          path: |
            ai-eval-results.json
            ai-eval-summary.json
          if-no-files-found: warn
          retention-days: 14
