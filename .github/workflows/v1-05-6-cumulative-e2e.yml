name: V1-05.6 Cumulative Domain E2E

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/v1-05-6-cumulative-e2e.yml"
      - "e2e/v1-05-6-domain-cumulative.spec.ts"
      - "e2e/public-visual-audit.spec.ts"
      - "e2e/i18n-43-locales.spec.ts"
      - "src/__tests__/v1-05-6-cumulative-e2e.test.ts"
      - "src/app/[locale]/properties/**"
      - "src/app/[locale]/services/**"
      - "src/app/[locale]/events/**"
      - "src/components/wizard/**"
      - "src/components/drawers/**"
      - "src/lib/public-pages/**"
      - "messages/**"
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "supabase/migration-governance/forward-epoch.json"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v1-05-6-cumulative-domain-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  repository-quality:
    name: Repository, locale and build gate
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Migration governance
        run: npm run migration:guard

      - name: Global-first locale contract
        run: npm run i18n:check

      - name: AI regression gate
        run: npm run eval:ai

      - name: TypeScript, ESLint, Vitest and production build
        run: npm run ci:quality

  public-domain-browser:
    name: Public browser, mobile, LTR and RTL gate
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run cumulative and inherited public domain journeys
        run: >-
          npx playwright test
          e2e/public-visual-audit.spec.ts
          e2e/i18n-43-locales.spec.ts
          e2e/v1-05-6-domain-cumulative.spec.ts
          --project=chromium
          --reporter=line,html

      - name: Upload V1-05.6 screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1-05-6-domain-screenshots-${{ github.run_id }}
          path: |
            playwright-audit-screenshots/
            playwright-v1-05-6-screenshots/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload V1-05.6 Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1-05-6-domain-playwright-report-${{ github.run_id }}
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload V1-05.6 browser failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1-05-6-domain-test-results-${{ github.run_id }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 30

  authenticated-domain-authority:
    name: Authenticated Property, Service and Event authority gate
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Prepare isolated cumulative project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .ci-supabase-v1-05-6
          mkdir -p .ci-supabase-v1-05-6
          cd .ci-supabase-v1-05-6
          supabase init
          rm -rf supabase/migrations supabase/tests
          mkdir -p supabase/migrations supabase/tests evidence

          cp \
            ../supabase/tests/fixtures/v1_05_4_4_current_contract_fixture.sql \
            supabase/migrations/00000000000000_v1_05_4_4_current_contract_fixture.sql
          cp \
            ../supabase/tests/fixtures/v1_05_4_6_completion_contract_fixture.sql \
            supabase/migrations/00000000000001_v1_05_4_6_completion_contract_fixture.sql
          cp \
            ../supabase/tests/fixtures/v1_05_4_5_event_contract_fixture.sql \
            supabase/migrations/00000000000002_v1_05_4_5_event_contract_fixture.sql
          cp \
            ../supabase/tests/fixtures/v1_05_4_7_cross_domain_e2e_fixture.sql \
            supabase/migrations/00000000000003_v1_05_4_7_cross_domain_e2e_fixture.sql
          cp \
            ../supabase/tests/fixtures/v1_05_4_7_matching_runtime_fixture.sql \
            supabase/migrations/00000000000004_v1_05_4_7_matching_runtime_fixture.sql

          for migration in \
            20260801163000_v1_05_4_1_canonical_cross_domain_matching.sql \
            20260802100000_v1_05_4_2_domain_aware_agreement.sql \
            20260802101500_v1_05_4_2_domain_exchange_handoff.sql \
            20260802170000_v1_05_4_3_property_reservation_authority.sql \
            20260802190000_v1_05_4_4_service_delivery_authority.sql \
            20260803001000_v1_05_4_5_event_transfer_authority.sql \
            20260803030000_v1_05_4_5_event_transfer_hardening.sql \
            20260803030500_v1_05_4_5_event_completion_guard_contract.sql \
            20260803043000_v1_05_4_6_domain_aware_exchange_completion.sql \
            20260803054500_v1_05_4_6_1_completion_readiness_hardening.sql \
            20260803074500_v1_05_4_7_matching_interest_ambiguity_hardening.sql
          do
            cp "../supabase/migrations/${migration}" supabase/migrations/
          done

          for contract in \
            v1_05_4_4_service_delivery_authority_contract.sql \
            v1_05_4_4_service_delivery_authority_replay.sql \
            v1_05_4_5_event_transfer_authority_contract.sql \
            v1_05_4_5_event_transfer_authority_replay.sql \
            v1_05_4_5_event_transfer_hardening_replay.sql \
            v1_05_4_6_domain_aware_exchange_completion_contract.sql \
            v1_05_4_6_domain_aware_exchange_completion_replay.sql \
            v1_05_4_6_1_completion_readiness_hardening_contract.sql \
            v1_05_4_6_1_completion_readiness_hardening_replay.sql \
            v1_05_4_7_cross_domain_e2e_contract.sql \
            v1_05_4_7_cross_domain_e2e_replay.sql \
            v1_05_6_event_object_e2e_replay.sql
          do
            cp "../supabase/tests/${contract}" supabase/tests/
          done

          find supabase/migrations supabase/tests -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | tee evidence/input-sha256.txt

      - name: Start isolated Supabase stack
        working-directory: .ci-supabase-v1-05-6
        shell: bash
        run: |
          set -o pipefail
          supabase start \
            -x studio,imgproxy,storage-api,realtime,inbucket,edge-runtime,logflare,vector,supavisor \
            2>&1 | tee evidence/supabase-start.log

      - name: Record isolated stack identity
        working-directory: .ci-supabase-v1-05-6
        shell: bash
        run: |
          set -euo pipefail
          supabase status | tee evidence/supabase-status.txt
          supabase migration list --local | tee evidence/migration-list.txt

      - name: Run Service authority catalog contract
        working-directory: .ci-supabase-v1-05-6
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql --host 127.0.0.1 --port 54322 --username postgres \
            --dbname postgres --set ON_ERROR_STOP=1 \
            --file supabase/tests/v1_05_4_4_service_delivery_authority_contract.sql \
            2>&1 | tee evidence/v1-05-4-4-service-catalog.log

      - name: Run Event authority catalog contract
        working-directory: .ci-supabase-v1-05-6
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql --host 127.0.0.1 --port 54322 --username postgres \
            --dbname postgres --set ON_ERROR_STOP=1 \
            --file supabase/tests/v1_05_4_5_event_transfer_authority_contract.sql \
            2>&1 | tee evidence/v1-05-4-5-event-catalog.log

      - name: Run shared completion catalog contracts
        working-directory: .ci-supabase-v1-05-6
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql --host 127.0.0.1 --port 54322 --username postgres \
            --dbname postgres --set ON_ERROR_STOP=1 \
            --file supabase/tests/v1_05_4_6_domain_aware_exchange_completion_contract.sql \
            2>&1 | tee evidence/v1-05-4-6-completion-catalog.log
          psql --host 127.0.0.1 --port 54322 --username postgres \
            --dbname postgres --set ON_ERROR_STOP=1 \
            --file supabase/tests/v1_05_4_6_1_completion_readiness_hardening_contract.sql \
            2>&1 | tee evidence/v1-05-4-6-1-hardening-catalog.log
          psql --host 127.0.0.1 --port 54322 --username postgres \
            --dbname postgres --set ON_ERROR_STOP=1 \
            --file supabase/tests/v1_05_4_7_cross_domain_e2e_contract.sql \
            2>&1 | tee evidence/v1-05-4-7-cross-domain-catalog.log

      - name: Run authenticated Service lifecycle regression
        working-directory: .ci-supabase-v1-05-6
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql --host 127.0.0.1 --port 54322 --username postgres \
            --dbname postgres --set ON_ERROR_STOP=1 \
            --file supabase/tests/v1_05_4_4_service_delivery_authority_replay.sql \
            2>&1 | tee evidence/v1-05-4-4-service-authenticated-replay.log

      - name: Run authenticated Event lifecycle regressions
        working-directory: .ci-supabase-v1-05-6
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql --host 127.0.0.1 --port 54322 --username postgres \
            --dbname postgres --set ON_ERROR_STOP=1 \
            --file supabase/tests/v1_05_4_5_event_transfer_authority_replay.sql \
            2>&1 | tee evidence/v1-05-4-5-event-authenticated-replay.log
          psql --host 127.0.0.1 --port 54322 --username postgres \
            --dbname postgres --set ON_ERROR_STOP=1 \
            --file supabase/tests/v1_05_4_5_event_transfer_hardening_replay.sql \
            2>&1 | tee evidence/v1-05-4-5-event-hardening-replay.log

      - name: Run authenticated shared completion regressions
        working-directory: .ci-supabase-v1-05-6
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql --host 127.0.0.1 --port 54322 --username postgres \
            --dbname postgres --set ON_ERROR_STOP=1 \
            --file supabase/tests/v1_05_4_6_domain_aware_exchange_completion_replay.sql \
            2>&1 | tee evidence/v1-05-4-6-completion-authenticated-replay.log
          psql --host 127.0.0.1 --port 54322 --username postgres \
            --dbname postgres --set ON_ERROR_STOP=1 \
            --file supabase/tests/v1_05_4_6_1_completion_readiness_hardening_replay.sql \
            2>&1 | tee evidence/v1-05-4-6-1-hardening-replay.log

      - name: Run authenticated Property-Service cumulative journey
        working-directory: .ci-supabase-v1-05-6
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql --host 127.0.0.1 --port 54322 --username postgres \
            --dbname postgres --set ON_ERROR_STOP=1 \
            --file supabase/tests/v1_05_4_7_cross_domain_e2e_replay.sql \
            2>&1 | tee evidence/v1-05-4-7-property-service-e2e.log

      - name: Run authenticated Event-Object cumulative journey
        working-directory: .ci-supabase-v1-05-6
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql --host 127.0.0.1 --port 54322 --username postgres \
            --dbname postgres --set ON_ERROR_STOP=1 \
            --file supabase/tests/v1_05_6_event_object_e2e_replay.sql \
            2>&1 | tee evidence/v1-05-6-event-object-e2e.log

      - name: Verify strict rollback cleanup
        working-directory: .ci-supabase-v1-05-6
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql --host 127.0.0.1 --port 54322 --username postgres \
            --dbname postgres --set ON_ERROR_STOP=1 \
            2>&1 <<'SQL' | tee evidence/cleanup.log
          do $cleanup$
          begin
            if exists (
              select 1 from auth.users
              where id::text like 'a5470000-%'
                 or id::text like 'a5060000-%'
            ) or exists (
              select 1 from public.profiles
              where user_id::text like 'a5470000-%'
                 or user_id::text like 'a5060000-%'
            ) or exists (
              select 1 from public.items
              where id::text like 'a5470000-%'
                 or id::text like 'a5060000-%'
            ) or exists (
              select 1 from public.matching_interests
              where from_item_id::text like 'a5470000-%'
                 or to_item_id::text like 'a5470000-%'
                 or from_item_id::text like 'a5060000-%'
                 or to_item_id::text like 'a5060000-%'
            ) or exists (
              select 1 from public.matches
              where initiator_item_id::text like 'a5470000-%'
                 or target_item_id::text like 'a5470000-%'
                 or initiator_item_id::text like 'a5060000-%'
                 or target_item_id::text like 'a5060000-%'
            ) or exists (
              select 1 from public.conversations
              where exists (
                select 1 from unnest(item_ids) item_id
                where item_id::text like 'a5470000-%'
                   or item_id::text like 'a5060000-%'
              )
            ) or exists (
              select 1 from public.messages
              where sender_id::text like 'a5470000-%'
                 or recipient_id::text like 'a5470000-%'
                 or sender_id::text like 'a5060000-%'
                 or recipient_id::text like 'a5060000-%'
            ) or exists (
              select 1 from public.swaps
              where requester_id::text like 'a5470000-%'
                 or responder_id::text like 'a5470000-%'
                 or requester_id::text like 'a5060000-%'
                 or responder_id::text like 'a5060000-%'
            ) or exists (
              select 1 from public.property_reservations
              where property_item_id::text like 'a5470000-%'
                 or property_item_id::text like 'a5060000-%'
            ) or exists (
              select 1 from public.service_deliveries
              where service_item_id::text like 'a5470000-%'
                 or service_item_id::text like 'a5060000-%'
            ) or exists (
              select 1 from public.event_transfers
              where event_item_id::text like 'a5470000-%'
                 or event_item_id::text like 'a5060000-%'
            ) or exists (
              select 1
              from public.event_proofs proof_row
              join public.event_transfers transfer_row
                on transfer_row.id = proof_row.transfer_id
              where transfer_row.event_item_id::text like 'a5470000-%'
                 or transfer_row.event_item_id::text like 'a5060000-%'
            ) then
              raise exception
                'V1-05.6 rollback cleanup left deterministic fixture data.';
            end if;
          end;
          $cleanup$;

          select jsonb_build_object(
            'v1_05_6_cleanup', 'PASS',
            'property_service_prefix', 'a5470000',
            'event_object_prefix', 'a5060000',
            'fixture_users', 0,
            'fixture_items', 0,
            'fixture_matching_rows', 0,
            'fixture_conversations', 0,
            'fixture_messages', 0,
            'fixture_exchanges', 0,
            'fixture_domain_ledgers', 0,
            'fixture_private_proofs', 0
          ) as cleanup_result;
          SQL

      - name: Upload cumulative authority evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1-05-6-cumulative-authority-${{ github.run_id }}
          path: .ci-supabase-v1-05-6/evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Stop isolated Supabase stack
        if: always()
        working-directory: .ci-supabase-v1-05-6
        run: supabase stop --no-backup
