          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Configure git
        run: |
          git config user.name "Claude"
          git config user.email "claude@anthropic.com"
      - name: Pull latest
        run: git pull --rebase origin ${{ github.ref_name }} || true
      - name: Translate ${{ matrix.locale }}
        run: node scripts/translate-direct.mjs ${{ matrix.locale }}
      - name: Commit and push
        run: |
          git add src/messages/${{ matrix.locale }}.json
          git commit -m "feat: translate ${{ matrix.locale }} via Claude Haiku [skip ci]" || echo "No changes"
          git push || (git pull --rebase && git push)

  # ── Batch 4: fi, sv, da, no, el, bn, hi, ms, fil, mn ──
  batch-4:
    if: inputs.batch == '4'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        locale: [fi, sv, da, no, el, bn, hi, ms, fil, mn]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Configure git
        run: |
          git config user.name "Claude"
          git config user.email "claude@anthropic.com"
      - name: Pull latest
        run: git pull --rebase origin ${{ github.ref_name }} || true
      - name: Translate ${{ matrix.locale }}
        run: node scripts/translate-direct.mjs ${{ matrix.locale }}
      - name: Commit and push
        run: |
          git add src/messages/${{ matrix.locale }}.json
          git commit -m "feat: translate ${{ matrix.locale }} via Claude Haiku [skip ci]" || echo "No changes"
          git push || (git pull --rebase && git push)

  # ── Batch 5: ga, mt, yi, fa, ro ──
  batch-5:
    if: inputs.batch == '5'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        locale: [ga, mt, yi, fa, ro]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
