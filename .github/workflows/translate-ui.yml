name: Translate UI

on:
  workflow_dispatch:
    inputs:
      batch:
        description: "Which batch to run (1=it-th, 2=ar-uk, 3=cs-da, 4=no-yi, 5=fa-ro)"
        required: true
        default: "1"
        type: choice
        options: ["1", "2", "3", "4", "5"]

env:
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

jobs:
  # ── Batch 1: it, de, fr, es, pt, nl, pl, id, vi, th ──
  batch-1:
    if: inputs.batch == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        locale: [it, de, fr, es, pt, nl, pl, id, vi, th]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Configure git
        run: |
          git config user.name "Claude"
          git config user.email "claude@anthropic.com"
      - name: Pull latest
        run: git pull --rebase origin ${{ github.ref_name }} || true
      - name: Translate ${{ matrix.locale }}
        run: node scripts/translate-direct.mjs ${{ matrix.locale }}
      - name: Commit and push
        run: |
          git add src/messages/${{ matrix.locale }}.json
          git commit -m "feat: translate ${{ matrix.locale }} via Claude Haiku [skip ci]" || echo "No changes"
          git push || (git pull --rebase && git push)

  # ── Batch 2: ar, ja, ko, zh, tr, ru, uk ──
  batch-2:
    if: inputs.batch == '2'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        locale: [ar, ja, ko, zh, tr, ru, uk]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
