name: Translate UI

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Vercel deployment URL (with /api/admin/translate-ui endpoint)"
        required: true
        default: "https://www.swaply.world"

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run translation script
        env:
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
        run: |
          node scripts/call-translate-api.mjs \
            "${{ github.event.inputs.target_url }}" \
            "$ADMIN_SECRET"

      - name: Push any remaining changes
        run: |
          git diff --quiet src/messages/ || {
            git add src/messages/*.json
            git commit -m "feat: auto-translate UI strings via Claude Haiku [skip ci]"
            git push
          }
