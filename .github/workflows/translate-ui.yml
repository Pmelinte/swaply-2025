name: Translate UI

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Vercel deployment URL (with /api/admin/translate-ui endpoint)"
        required: true
        default: "https://www.swaply.world"
      locales:
        description: "Comma-separated locales to translate (or 'all')"
        required: false
        default: "all"

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run translation script
        env:
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
        run: |
          # The script uses fetch which needs Node 18+
          node scripts/call-translate-api.mjs \
            "${{ github.event.inputs.target_url }}" \
            "$ADMIN_SECRET"

      - name: Check for changes
        id: changes
        run: |
          git diff --stat
          if git diff --quiet src/messages/; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push translations
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/messages/*.json
          git commit -m "feat: auto-translate UI strings via Claude Haiku [skip ci]"
          git push
