name: DeepSeek Agent PR

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Ce vrei să facă agentul (ex: 'Fix login: după submit rămân nelogat')"
        required: true
        type: string
      base_branch:
        description: "Branch-ul de bază (gol = branch-ul curent / default)"
        required: false
        type: string
      pr_branch:
        description: "Nume branch pentru PR (opțional). Dacă e gol, se generează automat."
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  deepseek_agent:
    runs-on: ubuntu-latest
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      TASK: ${{ inputs.task }}
      BASE_BRANCH: ${{ inputs.base_branch }}
      PR_BRANCH: ${{ inputs.pr_branch }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set base branch
        run: |
          set -e
          if [ -n "${BASE_BRANCH}" ]; then
            echo "Using BASE_BRANCH=${BASE_BRANCH}"
            git checkout "${BASE_BRANCH}"
          else
            echo "BASE_BRANCH not provided; staying on current branch: $(git rev-parse --abbrev-ref HEAD)"
          fi

      - name: Create work branch
        run: |
          set -e
          CURR="$(git rev-parse --abbrev-ref HEAD)"
          if [ -n "${PR_BRANCH}" ]; then
            NEWBR="${PR_BRANCH}"
          else
            NEWBR="deepseek/pr-$(date +%Y%m%d-%H%M%S)"
          fi
          echo "Creating branch ${NEWBR} from ${CURR}"
          git checkout -b "${NEWBR}"
          echo "NEW_BRANCH=${NEWBR}" >> $GITHUB_ENV

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate patch with DeepSeek (context-aware)
        run: |
          python - << 'PY'
          import os, json, textwrap, sys, subprocess, re
          import urllib.request

          api_key = os.environ.get("DEEPSEEK_API_KEY", "").strip()
          task = os.environ.get("TASK", "").strip()

          if not api_key:
            print("Missing DEEPSEEK_API_KEY secret", file=sys.stderr)
            sys.exit(1)
          if not task:
            print("Missing task input", file=sys.stderr)
            sys.exit(1)

          def sh(cmd: str) -> str:
            return subprocess.check_output(cmd, shell=True, text=True, stderr=subprocess.STDOUT)

          # Repo facts
          branch = sh("git rev-parse --abbrev-ref HEAD").strip()
          head = sh("git rev-parse HEAD").strip()

          # Helpful inventory (keep short-ish)
          files = sh("git ls-files").splitlines()
          # Prefer the important files for auth/login flow
          interesting = [
            "src/app/login/page.tsx",
            "src/lib/state.tsx",
            "src/lib/supabase/client.ts",
            "src/lib/supabase/server.ts",
            "src/middleware.ts",
            "middleware.ts",
            "src/app/layout.tsx",
            "src/app/page.tsx",
          ]

          def file_text(path: str) -> str:
            try:
              return sh(f"sed -n '1,260p' {path}")
            except Exception:
              return ""

          context_parts = []
          context_parts.append(f"BRANCH: {branch}")
          context_parts.append(f"HEAD: {head}")
          context_parts.append("IMPORTANT: Repo uses src/ as root; Next.js App Router is under src/app/ (NOT app/).")

          # Add a small file list excerpt
          # (only show top N to not explode tokens)
          context_parts.append("FILES (first 200):\n" + "\n".join(files[:200]))

          # Add content of interesting files (only those that exist)
          for p in interesting:
            if p in files:
              txt = file_text(p)
              if txt.strip():
                context_parts.append(f"\n===== FILE: {p} (first 260 lines) =====\n{txt}")

          repo_context = "\n\n".join(context_parts)

          system = textwrap.dedent("""
          You are a careful coding agent working on a Next.js + Supabase project.

          CRITICAL REPO STRUCTURE:
          - This repo uses src/ as the source root.
          - Next.js App Router lives under src/app/ (NOT app/).
          - You MUST NOT reference or modify any path under app/*.
          - Prefer minimal, safe changes.
          - If unsure, add TODO comments rather than risky logic.

          OUTPUT RULES (STRICT):
          - Return ONLY a unified diff patch (no explanations, no markdown, no code fences).
          - The output MUST include one or more diff blocks starting with: diff --git
          - Use correct paths that exist in the repo.
          - Do not modify secrets or environment variables.
          """).strip()

          user = f"""TASK:
          {task}

          REPO CONTEXT (authoritative, do not contradict it):
          {repo_context}

          Produce a unified diff patch that applies cleanly with git apply.
          """

          payload = {
            "model": "deepseek-chat",
            "messages": [
              {"role": "system", "content": system},
              {"role": "user", "content": user}
            ],
            "temperature": 0.2
          }

          req = urllib.request.Request(
            "https://api.deepseek.com/chat/completions",
            data=json.dumps(payload).encode("utf-8"),
            headers={
              "Content-Type": "application/json",
              "Authorization": f"Bearer {api_key}"
            },
            method="POST"
          )

          try:
            with urllib.request.urlopen(req, timeout=180) as resp:
              data = json.loads(resp.read().decode("utf-8"))
          except Exception as e:
            print(f"DeepSeek API call failed: {e}", file=sys.stderr)
            sys.exit(1)

          content = data["choices"][0]["message"]["content"]

          # Save raw model output for debugging
          with open("deepseek.raw.txt", "w", encoding="utf-8") as f:
            f.write(content)

          content = content.strip()

          # Strip accidental markdown fences if present
          content = re.sub(r"^```[a-zA-Z0-9_-]*\s*", "", content)
          content = re.sub(r"\s*```$", "", content)

          idx = content.find("diff --git")
          if idx == -1:
            print("Model output contains no 'diff --git' block. Check deepseek.raw.txt", file=sys.stderr)
            sys.exit(1)

          diff_text = content[idx:].strip()

          # Guards: forbid app/* paths and root middleware.ts
          bad = False
          if re.search(r"(?m)^diff --git a/app/|(?m)^--- a/app/|(?m)^\+\+\+ b/app/", diff_text):
            print("Patch illegally references app/* (repo uses src/app/*).", file=sys.stderr)
            bad = True

          if re.search(r"(?m)^diff --git a/middleware\\.ts|(?m)^--- a/middleware\\.ts|(?m)^\\+\\+\\+ b/middleware\\.ts", diff_text):
            print("Patch references root middleware.ts. Use src/middleware.ts if needed.", file=sys.stderr)
            bad = True

          if bad:
            print("Aborting patch. Check deepseek.raw.txt for model output.", file=sys.stderr)
            sys.exit(1)

          with open("deepseek.patch", "w", encoding="utf-8") as f:
            f.write(diff_text + "\n")

          print("Wrote deepseek.patch and deepseek.raw.txt")
          PY

      - name: Show patch (first 220 lines)
        run: |
          echo "---- deepseek.patch (head) ----"
          nl -ba deepseek.patch | sed -n '1,220p'
          echo "-------------------------------"

      - name: Apply patch (3-way)
        run: |
          set -e
          git apply --3way --whitespace=fix deepseek.patch
          git status --porcelain

      - name: Install deps
        run: npm ci

      - name: Build (safety check)
        run: npm run build

      - name: Commit changes
        run: |
          set -e
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "deepseek-agent"
          git config user.email "deepseek-agent@users.noreply.github.com"
          git add -A
          git commit -m "DeepSeek: apply task"

      - name: Push branch
        run: |
          set -e
          if git rev-parse --verify HEAD >/dev/null 2>&1; then
            git push --set-upstream origin "${NEW_BRANCH}"
          fi

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # If no commit was created, don't open PR
          if [ -z "$(git log --oneline -n 1 2>/dev/null)" ]; then
            echo "No commits found, skipping PR."
            exit 0
          fi

          BASE="${BASE_BRANCH}"
          if [ -z "${BASE}" ]; then
            # Default to repo default branch (best effort)
            BASE="$(git symbolic-ref refs/remotes/origin/HEAD | sed 's@^refs/remotes/origin/@@')"
          fi

          TITLE="DeepSeek Agent: ${TASK}"
          BODY="Automated changes generated by DeepSeek for task: ${TASK}"

          gh pr create --base "${BASE}" --head "${NEW_BRANCH}" --title "${TITLE}" --body "${BODY}" || true
