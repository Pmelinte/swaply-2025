name: DeepSeek Agent PR

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Ce vrei să facă agentul (ex: 'Fix login redirect; după submit rămân nelogat')"
        required: true
        type: string
      base_branch:
        description: "Branch-ul de bază (gol = default branch)"
        required: false
        type: string
      pr_branch:
        description: "Nume branch pentru PR (opțional)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  deepseek_agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set base branch
        id: base
        run: |
          if [ -n "${{ inputs.base_branch }}" ]; then
            echo "base_branch=${{ inputs.base_branch }}" >> $GITHUB_OUTPUT
          else
            echo "base_branch=${{ github.event.repository.default_branch }}" >> $GITHUB_OUTPUT
          fi

      - name: Switch to base branch
        run: |
          git checkout "${{ steps.base.outputs.base_branch }}"
          git pull --ff-only origin "${{ steps.base.outputs.base_branch }}"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate patch with DeepSeek
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TASK: ${{ inputs.task }}
        run: |
          python - << 'PY'
          import os, json, textwrap, sys, re
          import urllib.request

          api_key = os.environ.get("DEEPSEEK_API_KEY", "").strip()
          task = os.environ.get("TASK", "").strip()

          if not api_key:
            print("Missing DEEPSEEK_API_KEY secret", file=sys.stderr)
            sys.exit(1)
          if not task:
            print("Missing task input", file=sys.stderr)
            sys.exit(1)

          system = textwrap.dedent("""
          You are a careful coding agent working on a Next.js + Supabase project.

          CRITICAL REPO STRUCTURE:
          - This repo uses src/ as the source root.
          - Next.js App Router lives under src/app/ (NOT app/).
          - You MUST NOT reference or modify any path under app/*.
          - Middleware (if needed) should be src/middleware.ts, NOT middleware.ts at repo root.
          - Allowed paths to modify: src/app/**, src/components/**, src/lib/**, src/styles/**, supabase/**, public/**.

          OUTPUT RULES (STRICT):
          - Return ONLY a unified diff patch (no explanations, no markdown, no code fences).
          - Output MUST include one or more diff blocks starting with: diff --git
          - Use correct paths that exist in the repo.
          - Make minimal, safe changes. If unsure, add TODO comments rather than risky logic.
          - Do not modify secrets or environment variables.
          """).strip()

          user = f"Task:\n{task}\n\nReturn ONLY a unified diff patch that applies cleanly with git apply."

          payload = {
            "model": "deepseek-chat",
            "messages": [
              {"role": "system", "content": system},
              {"role": "user", "content": user}
            ],
            "temperature": 0.2
          }

          req = urllib.request.Request(
            "https://api.deepseek.com/chat/completions",
            data=json.dumps(payload).encode("utf-8"),
            headers={
              "Content-Type": "application/json",
              "Authorization": f"Bearer {api_key}"
            },
            method="POST"
          )

          try:
            with urllib.request.urlopen(req, timeout=180) as resp:
              data = json.loads(resp.read().decode("utf-8"))
          except Exception as e:
            print(f"DeepSeek API call failed: {e}", file=sys.stderr)
            sys.exit(1)

          content = data["choices"][0]["message"]["content"]

          # Save raw output for debugging
          with open("deepseek.raw.txt", "w", encoding="utf-8") as f:
            f.write(content)

          # Strip accidental markdown fences
          content = content.strip()
          content = re.sub(r"^```[a-zA-Z0-9_-]*\s*", "", content)
          content = re.sub(r"\s*```$", "", content)

          idx = content.find("diff --git")
          if idx == -1:
            print("Model output contains no 'diff --git' block. Check deepseek.raw.txt", file=sys.stderr)
            sys.exit(1)

          diff_text = content[idx:].strip()

          bad = False

          # Guard 1: forbid app/* paths (repo uses src/app/*)
          if re.search(r"^(?:\+\+\+ b/app/|--- a/app/|diff --git a/app/)", diff_text, flags=re.MULTILINE):
            print("Patch illegally references app/* (repo uses src/app/*).", file=sys.stderr)
            bad = True

          # Guard 2: forbid root middleware.ts (should be src/middleware.ts)
          if re.search(r"^(?:\+\+\+ b/middleware\.ts|--- a/middleware\.ts|diff --git a/middleware\.ts)", diff_text, flags=re.MULTILINE):
            print("Patch references root middleware.ts. Use src/middleware.ts if needed.", file=sys.stderr)
            bad = True

          if bad:
            print("Aborting patch. Check deepseek.raw.txt for model output.", file=sys.stderr)
            sys.exit(1)

          # IMPORTANT: newline must be actual '\n', not '\\n'
          with open("deepseek.patch", "w", encoding="utf-8", newline="\n") as f:
            f.write(diff_text + "\n")

          print("Wrote deepseek.patch and deepseek.raw.txt")
          PY

      - name: Show patch (first 220 lines)
        run: |
          echo "---- deepseek.patch (head) ----"
          nl -ba deepseek.patch | sed -n '1,220p'
          echo "-------------------------------"

      - name: Apply patch
        run: |
          git apply --whitespace=fix deepseek.patch
          git status --porcelain

      - name: Install deps
        run: npm ci

      - name: Build (safety check)
        run: npm run build

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: ${{ inputs.pr_branch }}
          delete-branch: true
          base: ${{ steps.base.outputs.base_branch }}
          title: "DeepSeek Agent: ${{ inputs.task }}"
          body: |
            PR generat automat de DeepSeek Agent (deepseek-chat).
            Task: ${{ inputs.task }}

            ✅ A rulat `npm run build` în GitHub Actions înainte de PR.

            Notă: dacă modelul a produs output nevalid, vezi deepseek.raw.txt în log.
          commit-message: "DeepSeek Agent: ${{ inputs.task }}"
