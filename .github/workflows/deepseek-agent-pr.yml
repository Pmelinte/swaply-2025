name: DeepSeek Agent PR

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Ce vrei să facă agentul (ex: 'Fix login redirect; după submit rămân nelogat')"
        required: true
        type: string
      base_branch:
        description: "Branch-ul de bază (lasă gol ca să folosească default branch)"
        required: false
        type: string
      pr_branch:
        description: "Nume branch pentru PR (opțional). Dacă e gol, se generează automat."
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  deepseek_agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set base branch
        id: base
        run: |
          if [ -n "${{ inputs.base_branch }}" ]; then
            echo "base_branch=${{ inputs.base_branch }}" >> $GITHUB_OUTPUT
          else
            echo "base_branch=${{ github.event.repository.default_branch }}" >> $GITHUB_OUTPUT
          fi

      - name: Switch to base branch
        run: |
          git checkout "${{ steps.base.outputs.base_branch }}"
          git pull --ff-only origin "${{ steps.base.outputs.base_branch }}"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate patch with DeepSeek
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TASK: ${{ inputs.task }}
        run: |
          python - << 'PY'
          import os, json, textwrap, sys, re
          import urllib.request

          api_key = os.environ.get("DEEPSEEK_API_KEY", "").strip()
          task = os.environ.get("TASK", "").strip()
          if not api_key:
            print("Missing DEEPSEEK_API_KEY secret", file=sys.stderr)
            sys.exit(1)
          if not task:
            print("Missing task input", file=sys.stderr)
            sys.exit(1)

          system = textwrap.dedent("""
          You are a careful coding agent working on a Next.js + Supabase project.
          Produce ONLY a unified diff patch that can be applied with `git apply`.

          HARD RULES:
          - Output ONLY the patch content (no explanations).
          - The patch MUST contain one or more blocks that start with: diff --git
          - Do not wrap output in Markdown code fences.
          - Make minimal, safe changes.
          - Do not modify secrets or environment variables.
          """).strip()

          user = f"Task:\n{task}\n\nReturn ONLY a unified diff patch."

          payload = {
            "model": "deepseek-chat",
            "messages": [
              {"role": "system", "content": system},
              {"role": "user", "content": user}
            ],
            "temperature": 0.2
          }

          req = urllib.request.Request(
            "https://api.deepseek.com/chat/completions",
            data=json.dumps(payload).encode("utf-8"),
            headers={
              "Content-Type": "application/json",
              "Authorization": f"Bearer {api_key}"
            },
            method="POST"
          )

          try:
            with urllib.request.urlopen(req, timeout=180) as resp:
              data = json.loads(resp.read().decode("utf-8"))
          except Exception as e:
            print(f"DeepSeek API call failed: {e}", file=sys.stderr)
            sys.exit(1)

          content = data["choices"][0]["message"]["content"]

          # Save raw model output for debugging (safe: no secrets here)
          with open("deepseek.raw.txt", "w", encoding="utf-8") as f:
            f.write(content)

          # Remove markdown fences if the model ignored instructions
          content = re.sub(r"^```[a-zA-Z0-9_-]*\s*", "", content.strip())
          content = re.sub(r"\s*```$", "", content.strip())

          # Extract only unified diff blocks starting at 'diff --git'
          # We keep everything from the first 'diff --git' to the end,
          # but also strip any leading junk.
          m = re.search(r"(?ms)^(diff --git .*?)\s*$", content)
          if not m:
            # fallback: find first occurrence
            idx = content.find("diff --git")
            if idx == -1:
              print("Model output contains no 'diff --git' block. Check deepseek.raw.txt", file=sys.stderr)
              sys.exit(1)
            diff_text = content[idx:].strip()
          else:
            diff_text = m.group(1).strip()

          # Extra safety: ensure it starts correctly
          if not diff_text.startswith("diff --git"):
            print("Extracted diff does not start with 'diff --git'. Check deepseek.raw.txt", file=sys.stderr)
            sys.exit(1)

          with open("deepseek.patch", "w", encoding="utf-8", newline="\n") as f:
            f.write(diff_text + "\n")

          print("Wrote deepseek.patch and deepseek.raw.txt")
          PY

      - name: Show patch (first 120 lines)
        run: |
          echo "---- deepseek.patch (head) ----"
          nl -ba deepseek.patch | sed -n '1,120p'
          echo "-------------------------------"

      - name: Apply patch
        run: |
          git apply --whitespace=fix deepseek.patch
          git status --porcelain

      - name: Install deps
        run: npm ci

      - name: Build (safety check)
        run: npm run build

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: ${{ inputs.pr_branch }}
          delete-branch: true
          base: ${{ steps.base.outputs.base_branch }}
          title: "DeepSeek Agent: ${{ inputs.task }}"
          body: |
            PR generat automat de DeepSeek Agent (deepseek-chat).
            Task: ${{ inputs.task }}

            ✅ A rulat `npm run build` în GitHub Actions înainte de PR.

            Debug: dacă patch-ul nu se aplică, verifică artifact-urile din log: deepseek.raw.txt / deepseek.patch (printate în Actions).
          commit-message: "DeepSeek Agent: ${{ inputs.task }}"
