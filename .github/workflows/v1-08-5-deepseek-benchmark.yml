name: V1-08.5 DeepSeek Real Benchmark

on:
  workflow_dispatch:
    inputs:
      max_budget_usd:
        description: "Approved maximum spend in USD (must be <= 5)"
        required: true
        default: "5"
        type: string

permissions:
  contents: read

concurrency:
  group: v1-08-5-deepseek-real-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    name: DeepSeek V4-Flash — 43 locales
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      V1085_MAX_BUDGET_USD: ${{ inputs.max_budget_usd }}
    steps:
      - name: Validate authorisation and secret
        shell: bash
        run: |
          node -e 'const b=Number(process.env.V1085_MAX_BUDGET_USD); if(!Number.isFinite(b)||b<=0||b>5) throw new Error("Budget must be >0 and <=5 USD")'
          test -n "$DEEPSEEK_API_KEY" || { echo "DEEPSEEK_API_KEY secret is missing"; exit 1; }

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run DeepSeek benchmark
        run: npx tsx scripts/run-v1-08-5-deepseek-benchmark.ts

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1-08-5-deepseek-v4-flash-evidence
          path: artifacts/v1-08-5/deepseek-v4-flash-results.json
          if-no-files-found: error
          retention-days: 90
