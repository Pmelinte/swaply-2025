name: Batch 65 Database Runtime

on:
  pull_request:
    paths:
      - ".github/workflows/batch-65-database-runtime.yml"
      - "scripts/test-batch-65-concurrency.sh"
      - "src/lib/state/index.tsx"
      - "supabase/config.toml"
      - "supabase/migrations/20260716130000_batch_65_global_profile_contract.sql"
      - "supabase/migrations/20260716130100_batch_65_profile_revision_guard.sql"
      - "supabase/migrations/20260716130200_batch_65_locale_registry_completion.sql"
      - "supabase/migrations/20260716130300_batch_65_1_profile_bootstrap_and_participant_projection.sql"
      - "supabase/migrations/20260716130400_batch_65_1_remove_legacy_profile_update_privilege.sql"
      - "supabase/tests/batch_65_runtime_*.sql"
      - "supabase/tests/batch_65_security_metadata_assertions.sql"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: batch-65-db-${{ github.ref }}
  cancel-in-progress: true

env:
  LOCAL_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
  SUPABASE_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  patch-legacy-profile-state:
    name: Canonicalize legacy state profile save
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Replace the final direct profile upsert
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/lib/state/index.tsx")
          text = path.read_text()

          import_anchor = 'import { useImageGallery } from "./useImageGallery";\n'
          import_line = 'import { mergeUserProfile, persistUserProfile } from "../profile/userProfilePersistence";\n'
          if import_line not in text:
            if import_anchor not in text:
              raise SystemExit("Profile persistence import anchor not found")
            text = text.replace(import_anchor, import_anchor + import_line, 1)

          start_marker = '  // ── Profile ──\n  const updateProfile = useCallback('
          end_marker = '\n\n  // ── Feature slice hooks ──'
          canonical_marker = 'const saved = await persistUserProfile(supabase, merged, {'

          if canonical_marker not in text:
            start = text.find(start_marker)
            if start < 0:
              raise SystemExit("Legacy updateProfile start marker not found")
            end = text.find(end_marker, start)
            if end < 0:
              raise SystemExit("Legacy updateProfile end marker not found")

            replacement = '''  // ── Profile ──
  const updateProfile = useCallback(
    async (updates: Partial<UserProfile>, options?: { persist?: boolean }) => {
      const currentUser = userRef.current;

      if (!currentUser) {
        if (options?.persist) {
          const message = "Cannot save profile: user not loaded yet.";
          setLastError(message);
          throw new Error(message);
        }
        return;
      }

      const merged = mergeUserProfile(currentUser, updates);
      setUser(merged);

      if (!options?.persist || !supabaseConfigured || !supabase) return;

      setLastError(null);
      try {
        const saved = await persistUserProfile(supabase, merged, {
          routeLocale: language,
        });
        setUser(saved);

        if (merged.fullName && merged.avatarUrl && merged.location?.city) {
          supabase.rpc("complete_onboarding_step", {
            p_user_id: merged.id,
            p_step: "profile",
          }).then(({ error: rpcErr }) => {
            if (rpcErr) {
              console.error("[onboarding] complete_onboarding_step error:", rpcErr.message);
            }
          });
          supabase.from("onboarding_progress").upsert(
            { user_id: merged.id, step_profile: true },
            { onConflict: "user_id" },
          ).then(({ error: obErr }) => {
            if (obErr) {
              console.error("[onboarding] step_profile update error:", obErr.message);
            }
          });
        }
      } catch (error) {
        const message = error instanceof Error ? error.message : "Profile save failed.";
        setLastError(message);
        throw error;
      }
    },
    [language, supabaseConfigured, supabase],
  );'''
            text = text[:start] + replacement + text[end:]

          if '.from("profiles").upsert' in text or '.from("profiles").update' in text:
            raise SystemExit("A direct profile write remains in state/index.tsx")

          path.write_text(text)

      - name: Commit canonical state correction
        id: commit
        shell: bash
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/state/index.tsx
          git commit -m "Batch 65.1: remove final direct profile upsert path"
          git push origin HEAD:${{ github.head_ref }}
          echo "changed=true" >> "$GITHUB_OUTPUT"

  batch-65-runtime:
    name: RLS, CAS, privacy and cleanup
    needs: patch-legacy-profile-state
    if: ${{ always() && needs.patch-legacy-profile-state.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Ensure PostgreSQL client
        shell: bash
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql --version

      - name: Start isolated local Supabase database
        run: supabase db start

      - name: Create Production-shaped test baseline
        run: psql "$LOCAL_DB_URL" -f supabase/tests/batch_65_runtime_setup.sql

      - name: Apply Batch 65 migration chain
        shell: bash
        run: |
          set -euo pipefail
          for migration in \
            supabase/migrations/20260716130000_batch_65_global_profile_contract.sql \
            supabase/migrations/20260716130100_batch_65_profile_revision_guard.sql \
            supabase/migrations/20260716130200_batch_65_locale_registry_completion.sql \
            supabase/migrations/20260716130300_batch_65_1_profile_bootstrap_and_participant_projection.sql \
            supabase/migrations/20260716130400_batch_65_1_remove_legacy_profile_update_privilege.sql
          do
            echo "Applying $migration"
            psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Run RLS, privacy, idempotency and stale-revision assertions
        run: psql "$LOCAL_DB_URL" -f supabase/tests/batch_65_runtime_assertions.sql

      - name: Audit SQL ownership, grants and search paths
        run: psql "$LOCAL_DB_URL" -f supabase/tests/batch_65_security_metadata_assertions.sql

      - name: Run two-session concurrency test
        run: bash scripts/test-batch-65-concurrency.sh

      - name: Prove cleanup zero
        run: psql "$LOCAL_DB_URL" -f supabase/tests/batch_65_runtime_cleanup.sql

      - name: Stop and destroy ephemeral database
        if: always()
        run: supabase stop --no-backup
