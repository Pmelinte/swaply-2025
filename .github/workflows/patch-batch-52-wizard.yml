name: Apply direct Batch 52 wizard repair

on:
  push:
    branches:
      - batch-52-objects-crud
    paths:
      - scripts/patch-batch-52-wizard.mjs

permissions:
  contents: write

jobs:
  patch-wizard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Batch 52 branch
        uses: actions/checkout@v4
        with:
          ref: batch-52-objects-crud
          fetch-depth: 0

      - name: Patch the object wizard submit path
        run: node scripts/patch-batch-52-wizard.mjs

      - name: Commit the direct repair and remove temporary patch files
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/patch-batch-52-wizard.mjs
          rm .github/workflows/patch-batch-52-wizard.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo "No patch changes were produced."; exit 1; }
          git commit -m "fix: normalize object wizard payload directly"
          git push origin HEAD:batch-52-objects-crud
