name: V1-05.4.7 One-time Test Fix

on:
  push:
    branches:
      - v1-05-4-7-cross-domain-e2e
    paths:
      - .github/workflows/v1-05-4-7-one-time-test-fix.yml

permissions:
  contents: write

jobs:
  fix-participant-assertion:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: v1-05-4-7-cross-domain-e2e
          fetch-depth: 0

      - name: Replace private-ledger read with RPC-response assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('supabase/tests/v1_05_4_7_cross_domain_e2e_replay.sql')
          text = path.read_text(encoding='utf-8')

          old = """  perform pg_temp.assert_true(
              coalesce((v_first ->> 'both_confirmed')::boolean, true) is false
                and coalesce((v_replay ->> 'replayed')::boolean, false)
                and (
                  select count(*)
                  from public.swap_completion_confirmations
                  where swap_id = v_swap_id
                ) = 1,
              'first participant completion must persist once and replay exactly'
            );"""

          new = """  perform pg_temp.assert_true(
              coalesce((v_first ->> 'both_confirmed')::boolean, true) is false
                and coalesce((v_first ->> 'replayed')::boolean, true) is false
                and coalesce((v_replay ->> 'replayed')::boolean, false)
                and jsonb_array_length(v_first -> 'confirmed_by') = 1
                and v_replay -> 'confirmed_by' = v_first -> 'confirmed_by',
              'first participant completion must persist once and replay exactly'
            );"""

          if old not in text:
              raise SystemExit('Expected V1-05.4.7 assertion block was not found exactly once.')
          if text.count(old) != 1:
              raise SystemExit('Expected V1-05.4.7 assertion block is ambiguous.')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit participant-safe replay assertion
        shell: bash
        run: |
          git config user.name "Swaply CI Fix"
          git config user.email "actions@users.noreply.github.com"
          git add supabase/tests/v1_05_4_7_cross_domain_e2e_replay.sql
          git diff --cached --check
          git commit -m "test(v1-05.4.7): keep completion assertion behind RPC boundary"
          git push origin HEAD:v1-05-4-7-cross-domain-e2e
