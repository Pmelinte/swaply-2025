name: Migrate Blog to Supabase

on:
  workflow_dispatch:

jobs:
  migrate:
    name: Migrate English blog posts to Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify secrets
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::NEXT_PUBLIC_SUPABASE_URL variable is not set"
            exit 1
          fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY secret is not set"
            exit 1
          fi
          echo "✓ All secrets configured"

      - name: Run migration
        run: node scripts/migrate-blog-to-supabase.mjs

      - name: Report results
        if: always()
        run: echo "Blog migration completed"
