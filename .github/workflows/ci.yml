name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  patch-batch-65-legacy-state:
    name: Patch Batch 65 legacy state
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Replace final direct profile upsert
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/lib/state/index.tsx")
          text = path.read_text()

          import_anchor = 'import { useImageGallery } from "./useImageGallery";\n'
          import_line = 'import { mergeUserProfile, persistUserProfile } from "../profile/userProfilePersistence";\n'
          if import_line not in text:
            if import_anchor not in text:
              raise SystemExit("Profile persistence import anchor not found")
            text = text.replace(import_anchor, import_anchor + import_line, 1)

          start_marker = '  // ── Profile ──\n  const updateProfile = useCallback('
          end_marker = '\n\n  // ── Feature slice hooks ──'
          canonical_marker = 'const saved = await persistUserProfile(supabase, merged, {'

          if canonical_marker not in text:
            start = text.find(start_marker)
            if start < 0:
              raise SystemExit("Legacy updateProfile start marker not found")
            end = text.find(end_marker, start)
            if end < 0:
              raise SystemExit("Legacy updateProfile end marker not found")

            replacement = '''  // ── Profile ──
  const updateProfile = useCallback(
    async (updates: Partial<UserProfile>, options?: { persist?: boolean }) => {
      const currentUser = userRef.current;

      if (!currentUser) {
        if (options?.persist) {
          const message = "Cannot save profile: user not loaded yet.";
          setLastError(message);
          throw new Error(message);
        }
        return;
      }

      const merged = mergeUserProfile(currentUser, updates);
      setUser(merged);

      if (!options?.persist || !supabaseConfigured || !supabase) return;

      setLastError(null);
      try {
        const saved = await persistUserProfile(supabase, merged, {
          routeLocale: language,
        });
        setUser(saved);

        if (merged.fullName && merged.avatarUrl && merged.location?.city) {
          supabase.rpc("complete_onboarding_step", {
            p_user_id: merged.id,
            p_step: "profile",
          }).then(({ error: rpcErr }) => {
            if (rpcErr) {
              console.error("[onboarding] complete_onboarding_step error:", rpcErr.message);
            }
          });
          supabase.from("onboarding_progress").upsert(
            { user_id: merged.id, step_profile: true },
            { onConflict: "user_id" },
          ).then(({ error: obErr }) => {
            if (obErr) {
              console.error("[onboarding] step_profile update error:", obErr.message);
            }
          });
        }
      } catch (error) {
        const message = error instanceof Error ? error.message : "Profile save failed.";
        setLastError(message);
        throw error;
      }
    },
    [language, supabaseConfigured, supabase],
  );'''
            text = text[:start] + replacement + text[end:]

          if '.from("profiles").upsert' in text or '.from("profiles").update' in text:
            raise SystemExit("A direct profile write remains in state/index.tsx")

          path.write_text(text)

      - name: Commit canonical state correction
        id: commit
        shell: bash
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/state/index.tsx
          git commit -m "Batch 65.1: remove final direct profile upsert path"
          git push origin HEAD:${{ github.head_ref }}
          echo "changed=true" >> "$GITHUB_OUTPUT"

  checks:
    name: Lint & Type Check
    needs: patch-batch-65-legacy-state
    if: ${{ always() && needs.patch-batch-65-legacy-state.result == 'success' && needs.patch-batch-65-legacy-state.outputs.changed != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run ESLint & TypeScript in parallel
        run: npm run lint & npm run typecheck & wait

  test:
    name: Unit Tests
    needs: patch-batch-65-legacy-state
    if: ${{ always() && needs.patch-batch-65-legacy-state.result == 'success' && needs.patch-batch-65-legacy-state.outputs.changed != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Vitest
        run: npx vitest run --reporter=json --outputFile=vitest-results.json

      - name: Upload Vitest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-results
          path: vitest-results.json
          if-no-files-found: warn
          retention-days: 14

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [checks, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'public/**') }}
          restore-keys: |
            nextjs-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nextjs-cache-${{ runner.os }}-

      - name: Build Next.js application
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: .next/
          retention-days: 7

  visual-audit:
    name: Public Visual Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run public visual audit
        run: npm run test:e2e:public

      - name: Upload visual audit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swaply-public-visual-audit-screenshots
          path: playwright-audit-screenshots/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swaply-public-visual-audit-report
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swaply-public-visual-audit-test-results
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
