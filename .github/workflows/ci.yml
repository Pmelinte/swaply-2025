name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  i18n-contract:
    name: 43-Locale Contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify all 43 locale catalogues
        shell: bash
        run: |
          set -o pipefail
          npm run i18n:check 2>&1 | tee i18n-contract-results.txt

      - name: Upload i18n contract results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i18n-contract-results
          path: i18n-contract-results.txt
          if-no-files-found: warn
          retention-days: 14

  checks:
    name: Lint & Type
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run changed-file ESLint and full TypeScript
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-parse "${HEAD_SHA}^")"
          fi

          git diff --name-only --diff-filter=ACMR "${BASE_SHA}" "${HEAD_SHA}" -- \
            '*.js' '*.jsx' '*.mjs' '*.cjs' '*.ts' '*.tsx' > eslint-files.txt

          mapfile -t eslint_files < eslint-files.txt
          lint_status=0
          type_status=0

          if (( ${#eslint_files[@]} > 0 )); then
            npx eslint "${eslint_files[@]}" > lint-results.txt 2>&1 || lint_status=$?
          else
            printf '%s\n' 'No changed JavaScript or TypeScript files to lint.' > lint-results.txt
          fi

          npm run typecheck > typecheck-results.txt 2>&1 || type_status=$?

          if (( lint_status != 0 )); then
            printf '%s\n' '--- CHANGED-FILE ESLINT FAILURE ---'
            cat lint-results.txt
          else
            printf 'Changed-file ESLint passed for %s file(s).\n' "${#eslint_files[@]}"
          fi

          if (( type_status != 0 )); then
            printf '%s\n' '--- FULL TYPESCRIPT FAILURE ---'
            cat typecheck-results.txt
          else
            printf '%s\n' 'Full TypeScript check passed.'
          fi

          if (( lint_status != 0 || type_status != 0 )); then
            exit 1
          fi

      - name: Upload lint and typecheck results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-and-typecheck-results
          path: |
            eslint-files.txt
            lint-results.txt
            typecheck-results.txt
          if-no-files-found: warn
          retention-days: 14

  checks-diagnostics:
    name: Lint & Type Diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: checks
    if: always() && needs.checks.result == 'failure'
    steps:
      - name: Download check evidence
        uses: actions/download-artifact@v4
        with:
          name: lint-and-typecheck-results
          path: diagnostics

      - name: Print check evidence
        shell: bash
        run: |
          printf '%s\n' '--- ESLINT FILES ---'
          cat diagnostics/eslint-files.txt
          printf '%s\n' '--- ESLINT RESULT ---'
          cat diagnostics/lint-results.txt
          printf '%s\n' '--- TYPESCRIPT RESULT ---'
          cat diagnostics/typecheck-results.txt

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Vitest
        run: npx vitest run --reporter=json --outputFile=vitest-results.json

      - name: Upload Vitest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-results
          path: vitest-results.json
          if-no-files-found: warn
          retention-days: 14

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [i18n-contract, checks, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'public/**') }}
          restore-keys: |
            nextjs-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nextjs-cache-${{ runner.os }}-

      - name: Build Next.js application
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: .next/
          retention-days: 7

  visual-audit:
    name: Public Visual & 43-Locale Audit
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run public visual audit
        run: npm run test:e2e:public

      - name: Run 43-locale routing and global layout audit
        run: npm run test:e2e:i18n

      - name: Upload visual audit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swaply-public-visual-audit-screenshots
          path: playwright-audit-screenshots/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload global locale screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swaply-i18n-43-locale-screenshots
          path: playwright-i18n-screenshots/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swaply-public-and-i18n-audit-report
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swaply-public-and-i18n-audit-test-results
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
